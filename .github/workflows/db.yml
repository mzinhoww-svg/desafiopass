name: Database

# Aplica a migracao (Task 0.3) e roda o seed (Task 0.4) no Postgres (Neon).
# Disparo manual (workflow_dispatch). O runner do Actions tem egress livre ao Neon,
# entao migrate (TCP) e seed funcionam aqui. POSTGRES_URL vem de um secret do repo.
#
# Input "reset": quando true, roda o db:reset DEPOIS do seed, deixando o banco
# limpo para o lancamento (apaga ligas e palpites e mantem apenas a allowlist de
# admins). CUIDADO: apaga dados de producao.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Rodar o seed (recria selecoes/partidas do seed ficticio). Desligue se o chaveamento real ja foi importado."
        type: boolean
        default: true
      reset:
        description: "Limpar o banco (apaga ligas/palpites e usuarios fora da allowlist)"
        type: boolean
        default: false

jobs:
  migrate-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar migracoes
        run: npm run db:migrate
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Rodar seed
        if: ${{ inputs.seed }}
        run: npm run db:seed
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      - name: Limpar banco (reset)
        if: ${{ inputs.reset }}
        run: npm run db:reset
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
